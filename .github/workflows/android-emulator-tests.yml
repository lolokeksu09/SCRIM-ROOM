name: Android emulator UI smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-emulator-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable hardware acceleration for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "KVM not present; emulator will use fallback"; fi
      - name: Run actual Android UI tests on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: bash .github/scripts/run-emulator-ui-tests.sh
      - name: Upload emulator evidence and instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SCRIM-ROOM-emulator-API${{ matrix.api-level }}-evidence
          path: |
            ui-evidence/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          retention-days: 14
          if-no-files-found: warn
