name: Android emulator UI smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-emulator-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable hardware acceleration for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "KVM not present; emulator will use fallback"; fi
      - name: Run actual Android UI tests on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            mkdir -p ui-evidence
            adb shell wm size
            adb shell wm density
            set +e
            gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace
            status=$?
            adb pull /sdcard/Android/data/dev.lolokeksu.scrimroom/files/ui-captures/ ui-evidence/ || true
            adb exec-out screencap -p > ui-evidence/final-screen.png || true
            adb logcat -d -s AndroidRuntime:E > ui-evidence/crashes.log || true
            exit "$status"
      - name: Upload emulator evidence and instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SCRIM-ROOM-emulator-API35-evidence
          path: |
            ui-evidence/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          retention-days: 14
          if-no-files-found: warn
