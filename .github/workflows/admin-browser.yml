name: Moderator browser smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/admin-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r server/requirements-test.txt playwright
          python -m playwright install --with-deps chromium
      - name: Run real browser against local server
        run: python -m server.tests.admin_browser_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCRIM-ROOM-moderator-browser-evidence
          path: admin-browser-evidence/
          retention-days: 14
          if-no-files-found: warn
