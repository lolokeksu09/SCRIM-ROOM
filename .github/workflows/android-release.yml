name: SCRIM ROOM - signed release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble unsigned release
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Sign and verify expected certificate
        env:
          SCRIM_KEYSTORE_B64: ${{ secrets.SCRIM_KEYSTORE_B64 }}
          SCRIM_KEYSTORE_PASSWORD: ${{ secrets.SCRIM_KEYSTORE_PASSWORD }}
          SCRIM_KEY_ALIAS: ${{ secrets.SCRIM_KEY_ALIAS }}
          SCRIM_KEY_PASSWORD: ${{ secrets.SCRIM_KEY_PASSWORD }}
          SCRIM_CERT_SHA256: ${{ secrets.SCRIM_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for name in SCRIM_KEYSTORE_B64 SCRIM_KEYSTORE_PASSWORD SCRIM_KEY_ALIAS SCRIM_KEY_PASSWORD SCRIM_CERT_SHA256; do
            if [ -z "${!name}" ]; then echo "Missing release configuration: $name"; exit 1; fi
          done
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$SCRIM_KEYSTORE_B64" | base64 -d > "$tmp/release.jks"
          tool="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist
          "$tool/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$tmp/aligned.apk"
          "$tool/apksigner" sign --ks "$tmp/release.jks" --ks-key-alias "$SCRIM_KEY_ALIAS" --ks-pass env:SCRIM_KEYSTORE_PASSWORD --key-pass env:SCRIM_KEY_PASSWORD --out dist/SCRIM-ROOM-release.apk "$tmp/aligned.apk"
          "$tool/apksigner" verify --verbose --print-certs dist/SCRIM-ROOM-release.apk > "$tmp/verification.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$tmp/verification.txt" | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$SCRIM_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected" && test "${#actual}" = 64 || { echo 'Release certificate mismatch'; exit 1; }
          "$tool/zipalign" -c -p 4 dist/SCRIM-ROOM-release.apk
          (cd dist && sha256sum SCRIM-ROOM-release.apk > SHA256SUMS)
          echo 'Release signature and expected certificate verified'
      - uses: actions/upload-artifact@v4
        with:
          name: SCRIM-ROOM-signed-release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
