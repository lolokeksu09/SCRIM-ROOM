services:
  scrim-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      SCRIM_DB_PATH: /data/scrim.sqlite3
      SCRIM_ADMIN_KEY: ${SCRIM_ADMIN_KEY:?Define a secret admin key with 32+ characters}
      SCRIM_MODERATOR_HASHES: ${SCRIM_MODERATOR_HASHES:-}
      SCRIM_REGISTRATION_OPEN: ${SCRIM_REGISTRATION_OPEN:-0}
    ports:
      - '127.0.0.1:8765:8080'
    volumes:
      - scrim-data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    cap_drop: ['ALL']
    pids_limit: 128
    tmpfs:
      - /tmp:size=16m,mode=1777

volumes:
  scrim-data:
